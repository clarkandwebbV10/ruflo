name: 'npm ci with retry'
description: >-
  Runs `npm ci` with retries for transient prebuilt-binary download failures.
  Fails immediately on npm EUSAGE (such as package/lockfile mismatch), because
  retrying an unchanged manifest cannot repair deterministic install errors.
inputs:
  args:
    description: 'Extra flags to pass to npm ci'
    required: false
    default: '--legacy-peer-deps'
  attempts:
    description: 'Number of attempts before failing the step'
    required: false
    default: '3'
  working-directory:
    description: >-
      Directory to run npm ci in. NOTE: working-directory on the calling
      (uses:) step itself has no effect on a composite action's internal
      run steps — GitHub rejects "working-directory cannot be used with
      uses" at parse time — so it must be threaded through as an input.
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        n=0
        max=${{ inputs.attempts }}
        log="$(mktemp)"
        trap 'rm -f "$log"' EXIT
        until [ "$n" -ge "$max" ]; do
          if npm ci ${{ inputs.args }} >"$log" 2>&1; then
            cat "$log"
            exit 0
          fi
          cat "$log"
          if grep -Eq 'npm (ERR!|error) code EUSAGE|npm ci can only install packages when' "$log"; then
            echo '::error::npm ci reported deterministic EUSAGE (check package.json/package-lock.json and flags); not retrying'
            exit 1
          fi
          n=$((n + 1))
          echo "npm ci failed (attempt $n/$max) — retrying only potentially transient errors"
          [ "$n" -lt "$max" ] && sleep 15
        done
        echo "npm ci failed after $max attempts"
        exit 1
