# One-time remediation of a known vulnerable transitive Vite dependency.
# Delete this workflow after CI commits the validated package-lock.json.
name: ruflo-patch-vite-lock-once
on:
  push:
    branches:
      - security/vite-rce-20261119
permissions:
  contents: write
jobs:
  patch-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve patched transitive Vite (no lifecycle scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Assert resolved Vite is patched
        run: |
          node -e "const p=require('./package-lock.json'); for(const [k,v] of Object.entries(p.packages||{})){if(k.endsWith('node_modules/vite')){const n=v.version.split('.').map(Number); if(n[0]!==8 || n[1]<3 || (n[1]===3 && n[2]<8)){throw Error('Vulnerable Vite remains at '+k+': '+v.version)}; console.log(k+': '+v.version)}}"
      - name: Reproduce install without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit validated lockfile to isolated security branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "security: lock patched Vite in Ruflo"
            git push origin HEAD:security/vite-rce-20261119
          fi
