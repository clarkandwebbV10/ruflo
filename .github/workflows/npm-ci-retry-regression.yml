name: SEC-012 npm-ci retry regression

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/actions/npm-ci-retry/action.yml'
      - 'tests/npm-ci-retry-deterministic.test.cjs'
      - '.github/workflows/npm-ci-retry-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry-contract:
    name: Fail-fast EUSAGE and bounded transient retries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR candidate
        uses: actions/checkout@v4
      - name: Use patched supported Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Run dependency-free regression before npm install
        run: node --test tests/npm-ci-retry-deterministic.test.cjs
